services:
  - type: web
    name: carebridge-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: DATABASE_URL
        value: sqlite:///./carebridge.db
      - key: CORS_ORIGINS
        value: '["https://carebridge-ai.vercel.app","http://localhost:5173"]'
      - key: ENABLE_EMAIL_ALERTS
        value: false

